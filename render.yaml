# ==========================================
# Revix System - Render Blueprint (IaC)
# One-click deployment for PostgreSQL, Backend, and Frontend
# ==========================================

services:
  # 1. Express + TypeScript Backend API
  - type: web
    name: revix-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: revix-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SESSION_COOKIE_NAME
        value: revix_session
      - key: SESSION_TTL_HOURS
        value: 168

  # 2. Next.js Bilingual Frontend
  - type: web
    name: revix-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

databases:
  # 3. PostgreSQL Database
  - name: revix-db
    plan: free
    databaseName: revix_system
    user: revix_user
